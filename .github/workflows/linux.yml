name: linux
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5", "8.4", "8.3", "8.2", "8.1", "8.0"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, sqlite3, pdo_sqlite
      - name: Prepare
        run: phpize
      - name: Build
        run: ./configure
      - name: Make
        run: make
      - name: Test
        run: make test
