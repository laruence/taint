name: linux
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5", "8.4", "8.3", "8.2", "8.1", "8.0"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, sqlite3, pdo_sqlite
      - name: Prepare
        run: phpize
      - name: Build
        run: ./configure
      - name: Make
        run: make
      - name: Test
        run: make test

  debug:
    name: "Linux PHP ${{ matrix.php }} (debug)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # both ends of the supported range: 8.0 exercises the engine shims,
        # 8.5 the current engine internals
        php: ["8.0", "8.5"]
    env:
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison re2c libxml2-dev libsqlite3-dev libpq-dev
      - name: Build PHP ${{ matrix.php }} from source (debug)
        run: |
          git clone --depth 1 --branch PHP-${{ matrix.php }} https://github.com/php/php-src.git ../php-src
          cd ../php-src
          ./buildconf --force
          ./configure --prefix="$GITHUB_WORKSPACE/../php-install" \
            --enable-debug --disable-all \
            --enable-pdo --with-sqlite3 --with-pdo-sqlite \
            --with-mysqli --with-pgsql
          make -j$(nproc)
          # in-tree scripts/php-config is not executable (php-config.in is
          # committed 644), so build taint against the installed tree
          make install
      - name: Build taint
        run: |
          export PATH="$GITHUB_WORKSPACE/../php-install/bin:$PATH"
          phpize
          ./configure --with-php-config="$GITHUB_WORKSPACE/../php-install/bin/php-config"
          make
      - name: Test
        run: |
          PHP="$GITHUB_WORKSPACE/../php-install/bin/php"
          TEST_PHP_EXECUTABLE="$PHP" "$PHP" run-tests.php \
            -d extension="$GITHUB_WORKSPACE/modules/taint.so" -q tests/
